# CustomComponents configuration — the active settings only.
# Set options here before launch. Internal diagnostic detours run quietly by default.
# Private-server PvP: use identical builds, card data, and deck settings on both clients.

# Master enable switch.
[General]
Enabled=true

# Gameplay and local/PvP submission; keep server-side validation.
[PickFromThree]
LiveCandidateProbe=true
EnableGameplaySubmission=true
SubmitInPVP=true
PvpTimeoutMarginMs=600
ResolveServiceFromInjectionBinder=true
SyncLocalCompletionSignal=true

# Stock lifecycle recovery. Leave enabled unless investigating a regression.
# Patch 1.7.20: read-only stock state-5 targeting capture.
# Adds ONE optional hook to the long highlight command; reuses the already
# installed Determine/Bind detours. Disable here for a baseline comparison.
# Does NOT implement multi-choice revive pre-Play submission.
[Pick3PrePlayTrace]
Enabled=true

[Pick3LifecycleRepair]
GuardedStockButtonRecovery=true

# Lightweight Discover-style PF3 frontend.
# UseStockTargeting=true bypasses the custom presentation entirely and leaves
# stock input/UI in charge; set false for a working PF3 Discover popup.
[PickFromThreePresentation]
Enabled=true
UseStockTargeting=false
MaskStockTargetUI=true
# Stock-command-owned selection tries to restore ordinary card play/turn buttons.
# If a device cannot route the Choose tap into SelectTargetCommand, disable for comparison.
StockCommandHandoff=true
# One-option PF3 now displays a single Choose card to ensure stock-command
# completion. Automatic direct-service selection was unsafe for revive/lane.

# Localized PF3 targeting prompt; same controls as before the presentation port.
[Pick3TargetingText]
BehindCards=false
PositionX=0
PositionY=520
FontSizePercent=80
MaxCharactersPerLine=32

# Optional Stage 8 hook isolation for troubleshooting.
[Pick3Stage8Isolation]
CandidateBridge=true
SubmissionHooks=true

# -1 = full startup. Other modes isolate a crash, not a normal gameplay config.
[StartupDiagnostics]
StartupCutoff=-1
CombatHookMode=3
Pick3HookMode=-1

# Optional read-only tracing; disabled during ordinary matches.
[Pick3Diagnostics]
PredictionCloneAudit=false

# Optional read-only initial-match snapshot.
[PvpDeckDiagnostics]
InitSnapshot=false

# Stock PvP match initialization. "auto" validates new 40/4 decks at runtime;
# pin a 16-digit hash instead to restrict to one tested deck configuration.
# The two-card/one-card trial flags are kept for reversible diagnosis.
[PvpDeckPrepopulation]
Mode=2
BothModdedClientsLab=true
ConstructStockSystemLab=true
ConstructStockEffectLab=true

ExecuteOneCardLab=false
ExecuteTwoCardLab=false
ExecuteFullDeckLab=true

TwoCardTargetPoolId=1
ExpectedDeckFingerprint=auto
# Test-only: use stock per-entry creation for newly generated PvP deck cards.
# Use on both private-server clients with identical builds.
MaterializeInsertedCardsPvp=true

[Pick3CreationTrace]
Enabled=true
[StatIcons]
Enabled=true
Verbose=false
# Place PNGs under <Folder>/sprig/sprites/. No image assets were in the archive.
Folder=/sdcard/Android/data/com.ea.gp.pvzheroes/files
# Icon1=Thrash, Attack, 6, thrash-frame.png, 1.0
# Format: registry ability, Attack or Health, reserved SpecialAbilityType, PNG, scale

[Performance]
# Aggregate timings every three seconds; enable for the next lag investigation.
# No per-card logging or gameplay/RNG changes. Keep false for normal play.
Enabled=true
