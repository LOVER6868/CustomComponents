# CustomComponents configuration — the active settings only.
# Set options here before launch. Internal diagnostic detours run quietly by default.
# Private-server PvP: use identical builds, card data, and deck settings on both clients.

# Master enable switch.
[General]
Enabled=true

# Gameplay and local/PvP submission; keep server-side validation.
[PickFromThree]
LiveCandidateProbe=true
EnableGameplaySubmission=true
SubmitInPVP=true
PvpTimeoutMarginMs=600
ResolveServiceFromInjectionBinder=true
SyncLocalCompletionSignal=true

# Stock lifecycle recovery. Leave enabled unless investigating a regression.
[Pick3LifecycleRepair]
GuardedStockButtonRecovery=true
SuspendInterruptedPick3=true
DriveFirstPickerFromHolder=false

# Popup behavior and animations (times in milliseconds).
[PickFromThreePreview]
Enabled=true
ShowCloseButton=false
AsyncGameArt=false
NativeSpriteCacheTest=false
NativeSpriteCacheRequestArt=false
PreloadMilliseconds=0
EntranceMilliseconds=300
PressFeedbackMilliseconds=700
ExitAnimationMilliseconds=180
MaskStockTargetUI=false

# Battlefield darkness: 0 transparent, 100 black; input shield remains active.
[Pick3Overlay]
BattlefieldDarkeningPercent=42

# Chosen-card travel timings (milliseconds); exponent 350 = 3.50.
[Pick3ChoiceMotion]
GlideMilliseconds=400
GlideExponentHundredths=350
CenterHoldMilliseconds=70
FadeMilliseconds=180
OtherCardsDismissMilliseconds=240
LowerCardArcPercent=5
PuffPercent=31

# Design coordinates: centered 720 x 1280, scaled uniformly.
[Pick3Screen]
ReferenceWidth=720
ReferenceHeight=1280

# Localized selection prompt: centered coordinates, +Y is upward.
[Pick3TargetingText]
BehindCards=false
PositionX=0
PositionY=520
FontSizePercent=125

# Card positions/sizes as percentages of the design canvas or card.
[Pick3RewardLayout]
TopYPercent=21
LowerYPercent=-24
SideGapPercent=24
PortraitYPercent=28
PortraitSizePercent=104
NameBelowStatsPercent=80
PlateBelowNamePercent=28
ButtonBelowPlatePercent=31
PlateWidthPercent=136
PlateHeightPercent=39
AttackBadgeYOffsetPercent=0
HealthBadgeYOffsetPercent=0
ButtonWidthPercent=98
ButtonHeightPercent=120
NameSizePercent=140
StatSizePercent=126
ButtonTextSizePercent=108
ButtonTextYOffsetPercent=0
BadgeSizePercent=24
StatSpacingPercent=13
StatsBelowPortraitPercent=40

# Per-stat typography/offsets; percentages are relative to the card elements.
[Pick3StatText]
AttackSizePercent=110
HealthSizePercent=110
CostSizePercent=110
DescriptionSizePercent=160
AttackXOffsetPercent=0
AttackYOffsetPercent=0
HealthXOffsetPercent=0
HealthYOffsetPercent=0
CostXOffsetPercent=0
CostYOffsetPercent=0
DescriptionXOffsetPercent=0
DescriptionYOffsetPercent=0
AttackWidthPercent=90
HealthWidthPercent=90
CostWidthPercent=90
DescriptionWidthPercent=93
DescriptionHeightPercent=87

# Description plate sizing and text fitting.
[Pick3Description]
AutoSizePlate=true
MinWidthPercent=75
MaxWidthPercent=155
MinHeightPercent=25
MaxHeightPercent=65
PaddingPercent=8
AutoFitText=true

# Native avatar rendering budget (FPS); disable artwork for isolation.
[Pick3Performance]
EnableNativeArtwork=true
FighterFps=30
EnvironmentFps=24
OtherFps=24
GlobalRenderFpsCap=75
RenderEveryNTicks=1
LoadSpacingFrames=2

# Native image sizing relative to the card.
[Pick3NativeArtwork]
ViewSizePercent=250
EnvironmentViewSizePercent=250
EnvironmentYOffsetPercent=0
ViewHeightPercent=100

# Stock-style CardView camera framing; adjustments are percentages.
[Pick3CardViewCamera]
ZoomPercent=100
PaddingPercent=145
MinOrthoHundredths=20
MaxOrthoHundredths=1200
OffsetXPercent=0
OffsetYPercent=0
UseDominantRenderer=true
UseStableInspectionFraming=true
FighterBaselineOrthoHundredths=700
EnvironmentBaselineOrthoHundredths=900
OtherBaselineOrthoHundredths=750
SafetyOverscanPercent=120
EnvironmentZoomPercent=100
EnvironmentCameraYOffsetPercent=0

# Keyword-tooltip appearance and animation.
[Pick3InlineTooltip]
FontSizePercent=100
MaxWidthPercent=64
MaxHeightPercent=17
PopupMilliseconds=120
PopoutMilliseconds=90

# Stock icon/trait/class assets and picker use.
[Pick3GameOwnedAssets]
Enabled=true
UseInPicker=true
UseTraitIcons=true
UseClassRims=true

# Native class rim and circular artwork framing.
[Pick3NativeClassArt]
CropTallSprites=true
CircleCenterXPercent=50
CircleCenterYPercent=68
CircleWidthPercent=33
ShowReferenceFallback=true
GrassSizePercent=94
RequestNativePrefabExperimental=false

# Optional owned-UnityFS asset support; experimental prewarm disabled.
[Pick3OwnedUnityFS]
Enabled=false
ProbeMode=0
MaxAssetIndex=6
PrewarmStartFrames=180
PrewarmStepFrames=12
PrewarmMatchFrames=180
AllowTextureToSprite=false
LoadNativeColorScheme=false
EnableSplitRim=true
EnableButtonSlicing=false

# Optional Stage 8 hook isolation for troubleshooting.
[Pick3Stage8Isolation]
CandidateBridge=true
SubmissionHooks=true

# -1 = full startup. Other modes isolate a crash, not a normal gameplay config.
[StartupDiagnostics]
StartupCutoff=-1
CombatHookMode=3
Pick3HookMode=-1

# Optional read-only tracing; disabled during ordinary matches.
[Pick3Diagnostics]
PredictionCloneAudit=false

# Optional read-only initial-match snapshot.
[PvpDeckDiagnostics]
InitSnapshot=false

# Stock PvP match initialization. "auto" validates new 40/4 decks at runtime;
# pin a 16-digit hash instead to restrict to one tested deck configuration.
# The two-card/one-card trial flags are kept for reversible diagnosis.
[PvpDeckPrepopulation]
Mode=2
BothModdedClientsLab=true
ConstructStockSystemLab=true
ConstructStockEffectLab=true

ExecuteOneCardLab=false
ExecuteTwoCardLab=false
ExecuteFullDeckLab=true

TwoCardTargetPoolId=1
ExpectedDeckFingerprint=auto
# Test-only: use stock per-entry creation for newly generated PvP deck cards.
# Use on both private-server clients with identical builds.
MaterializeInsertedCardsPvp=true

[Pick3CreationTrace]
Enabled=true
