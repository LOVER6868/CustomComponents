# Release settings. Diagnostics are disabled; tracing profiles live in docs/diagnostics.
# Multiplayer custom decks require the same module/card data on both clients.

[General]
Enabled=true

[PickFromThree]
LiveCandidateProbe=true
EnableGameplaySubmission=true
SubmitInPVP=true
PvpTimeoutMarginMs=600
ResolveServiceFromInjectionBinder=true
SyncLocalCompletionSignal=true

[Pick3PrePlayTrace]
Enabled=false

[Pick3LifecycleRepair]
GuardedStockButtonRecovery=true

[PickFromThreePresentation]
Enabled=true
UseStockTargeting=false
MaskStockTargetUI=true
StockCommandHandoff=true

[Pick3TargetingText]
BehindCards=false
PositionX=0
PositionY=520
FontSizePercent=80
MaxCharactersPerLine=32

[CustomHistory]
Trace=false

[Pick3CreationTrace]
Enabled=false

[StatIcons]
Enabled=true
Verbose=false
Folder=/sdcard/Android/data/com.ea.gp.pvzheroes/files

[Performance]
Enabled=false

[NonCombatTruestrike]
UseTruestrikeIcons=false

[CombatPresentation]
RotateFighters=true

[Multiplayer]
CustomDeckInitialization=true
MaterializeInsertedCards=true
ExpectedDeckFingerprint=auto

