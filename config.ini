# CustomComponents — one PickFromThree configuration, grouped by purpose.
# Values load when the module starts. Rebuild/reinstall for changes here.
# ADB diagnostic selectors are documented in docs/PICKFROMTHREE.md.

[General]
Enabled=true

# GAMEPLAY: never enable PvP without server-side selection verification.
[PickFromThree]
LiveCandidateProbe=true
EnableGameplaySubmission=true
# PvP live-entity targeting remains enabled. CardDatabase PvP remains blocked
# pending an authoritative GUID protocol; never send a proxy as if it were the GUID.
SubmitInPVP=true
PvpTimeoutMarginMs=600
ResolveServiceFromInjectionBinder=true
# Preserve the original local completion fallback; PvP never dispatches it.
SyncLocalCompletionSignal=true

# PRESENTATION: popup and transition timings (milliseconds).
[PickFromThreePreview]
Enabled=true
ShowCloseButton=false
AsyncGameArt=false
NativeSpriteCacheTest=false
NativeSpriteCacheRequestArt=false
PreloadMilliseconds=0
EntranceMilliseconds=300
PressFeedbackMilliseconds=700
ExitAnimationMilliseconds=180
MaskStockTargetUI=false

# BACKGROUND DARKENING: 0=transparent scene, 42=original normal dimming,
# 55=the old 'MaskStockTargetUI' level, 100=fully blackened battlefield.
# Touch shield stays enabled even at 0; only visual darkness changes.
[Pick3Overlay]
BattlefieldDarkeningPercent=42

# CHOSEN-CARD TRAVEL: all timings in real milliseconds, independent of FPS.
# Glide=400ms + center pause=70ms + fade=180ms (+20ms safety) = 670ms.
# PressFeedbackMilliseconds is automatically raised to cover this animation.
# Exponent 350 means 3.50; lower numbers are softer/more gradual.
[Pick3ChoiceMotion]
GlideMilliseconds=400
GlideExponentHundredths=350
CenterHoldMilliseconds=70
FadeMilliseconds=180
OtherCardsDismissMilliseconds=240
LowerCardArcPercent=5
PuffPercent=31

# COORDINATES: all screen-facing X/Y positioning is centered on an authored
# 720x1280 coordinate space and scaled UNIFORMLY to fit the device viewport.
# 0,0 = display center; +Y = up. Artwork sub-elements use card-local units.
[Pick3Screen]
ReferenceWidth=720
ReferenceHeight=1280

# SINGLE PROMPT: replaces the duplicate "Choose a card..." header. Its text is
# the game's actual localized PickFromThree targeting string, when available.
# Positions are absolute reference-resolution units (not screen percentages).
[Pick3TargetingText]
BehindCards=false
PositionX=0
PositionY=520
FontSizePercent=125

# REWARD CARD LAYOUT: positions/gaps are reference-resolution percentages;
# each is multiplied by the fixed-size reference canvas (NOT the phone pixels).
# Child sizing is relative to its own card. Cost icon sits on the RIGHT.
[Pick3RewardLayout]
TopYPercent=21
LowerYPercent=-24
SideGapPercent=24
PortraitYPercent=28
PortraitSizePercent=104
NameBelowStatsPercent=80
PlateBelowNamePercent=28
ButtonBelowPlatePercent=31
PlateWidthPercent=136
PlateHeightPercent=39
AttackBadgeYOffsetPercent=0
HealthBadgeYOffsetPercent=0
ButtonWidthPercent=98
ButtonHeightPercent=120
NameSizePercent=140
StatSizePercent=126
ButtonTextSizePercent=108
ButtonTextYOffsetPercent=0
BadgeSizePercent=24
StatSpacingPercent=13
StatsBelowPortraitPercent=40

# TEXT: percentages relative to fitted per-element icon/description size.
# Font defaults are larger; TMP autosizing still protects longer localizations.
[Pick3StatText]
AttackSizePercent=110
HealthSizePercent=110
CostSizePercent=110
DescriptionSizePercent=120
AttackXOffsetPercent=0
AttackYOffsetPercent=0
HealthXOffsetPercent=0
HealthYOffsetPercent=0
CostXOffsetPercent=0
CostYOffsetPercent=0
DescriptionXOffsetPercent=0
DescriptionYOffsetPercent=0
AttackWidthPercent=90
HealthWidthPercent=90
CostWidthPercent=90
DescriptionWidthPercent=93
DescriptionHeightPercent=87

[Pick3Description]
AutoSizePlate=true
MinWidthPercent=75
MaxWidthPercent=155
MinHeightPercent=25
MaxHeightPercent=65
PaddingPercent=8
AutoFitText=true
FontSizePercent=160

# Kept for compatibility; never bypass server validation.
[Pick3Experimental]
AllowUnverifiedPvp=true
AllowNativeCardViewFactory=true

[Pick3Performance]
# Safety default for physical ARM64 phones: native CardView rendering was
# captured SIGSEGVing while recursively walking renderer transforms.
# Set true only when explicitly testing the native animation crash again.
EnableNativeArtwork=true
FighterFps=30
EnvironmentFps=24
OtherFps=24
GlobalRenderFpsCap=75
RenderEveryNTicks=1
LoadSpacingFrames=2

# VISIBLE ARTWORK: RawImage sizes relative to card width, outside circular rim.
[Pick3NativeArtwork]
ViewSizePercent=250
EnvironmentViewSizePercent=250
EnvironmentYOffsetPercent=0
ViewHeightPercent=100

# CAMERA: shared stock-inspired baseline, adapted to measured visible body
# bounds. Position corrections are percent of measured model half-size.
# For abnormal pivots (Banana Launcher / unusually tall environments) tune the
# category offsets. Do not alter the original CardView transform/scale.
[Pick3CardViewCamera]
ZoomPercent=100
PaddingPercent=145
MinOrthoHundredths=20
MaxOrthoHundredths=1200
OffsetXPercent=0
OffsetYPercent=0
UseDominantRenderer=true
UseStableInspectionFraming=true
FighterBaselineOrthoHundredths=700
EnvironmentBaselineOrthoHundredths=900
OtherBaselineOrthoHundredths=750
SafetyOverscanPercent=120
EnvironmentZoomPercent=100
EnvironmentCameraYOffsetPercent=0
FighterCameraYOffsetPercent=0
OtherCameraYOffsetPercent=0
AdaptiveFraming=true
AdaptiveZoomMaxPercent=160

[Pick3InlineTooltip]
FontSizePercent=100
MaxWidthPercent=64
MaxHeightPercent=17
PopupMilliseconds=120
PopoutMilliseconds=90

# ORIGINAL GAME ASSETS / STATIC FALLBACK.
[Pick3GameOwnedAssets]
Enabled=true
UseInPicker=true
LogCaptures=false
UseTraitIcons=true
UseClassRims=true

[Pick3NativeClassArt]
CropTallSprites=true
CircleCenterXPercent=50
CircleCenterYPercent=68
CircleWidthPercent=33
ShowReferenceFallback=true
GrassSizePercent=94
RequestNativePrefabExperimental=false

# No early AssetBundle.LoadFromFile and no unsafe Unity scene prewarming.
[Pick3OwnedUnityFS]
Enabled=false
ProbeMode=0
MaxAssetIndex=6
PrewarmStaticUI=false
PrewarmStartFrames=180
PrewarmStepFrames=12
PrewarmMatchFrames=180
PrewarmFallbackSprites=false
AllowTextureToSprite=false
LoadNativeColorScheme=false
EnableSplitRim=true
EnableButtonSlicing=false

[Pick3Stage8Isolation]
CandidateBridge=true
SubmissionHooks=true
