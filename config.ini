# CustomComponents — PickFromThree user settings
# Advanced/internal options use safe source defaults. Restart the game after edits.
# All values marked Percent are percentages; timings are milliseconds.

[General]
Enabled=true

[PickFromThree]
LiveCandidateProbe=true
EnableGameplaySubmission=true
SubmitInPVE=true
SubmitInPVP=false

[PickFromThreePreview]
Enabled=true
EntranceMilliseconds=300
PressFeedbackMilliseconds=700
ExitAnimationMilliseconds=180

[Pick3Overlay]
BattlefieldDarkeningPercent=42

[Pick3ChoiceMotion]
GlideMilliseconds=400
CenterHoldMilliseconds=70
FadeMilliseconds=180
OtherCardsDismissMilliseconds=240

# Position and spacing; all sizes relative to the internal reference canvas.
[Pick3Layout]
TopYPercent=21
LowerYPercent=-24
SideGapPercent=24
PortraitSizePercent=104
# Adjust attack/health badge separation and vertical placement.
StatSpacingPercent=13
StatsBelowPortraitPercent=40
AttackBadgeYOffsetPercent=0
HealthBadgeYOffsetPercent=0
NameBelowStatsPercent=60
PlateBelowNamePercent=24
ButtonBelowPlatePercent=32
ButtonWidthPercent=98
ButtonHeightPercent=120

# One scale per text type; stat fonts autoshrink to stay inside the badges.
[Pick3Text]
NameSizePercent=160
AttackSizePercent=190
HealthSizePercent=190
CostSizePercent=190
ButtonTextSizePercent=108

# One description plate system. Width/height are percentage of the reward card.
# The plate grows for longer text and the Choose button shifts down with it.
[Pick3Description]
FontSizePercent=160
MinWidthPercent=100
MaxWidthPercent=140
MinHeightPercent=40
MaxHeightPercent=85
PaddingPercent=7

[Pick3Performance]
EnableNativeArtwork=true
FighterFps=60
EnvironmentFps=60
OtherFps=60
GlobalRenderFpsCap=190
RenderEveryNTicks=1
LoadSpacingFrames=1

[Pick3CardViewCamera]
ZoomPercent=100
PaddingPercent=145
UseStableInspectionFraming=true
AdaptiveFraming=true

# Keyword explanations when tapping linked text in PickFromThree.
# 100 = original, 150 = 50% larger (may shrink to fit long text).
[Pick3InlineTooltip]
FontSizePercent=150

# Read-only stock multiplayer target-selection tracing. No PvP custom submission.
[Pick3PvpTrace]
Enabled=false
